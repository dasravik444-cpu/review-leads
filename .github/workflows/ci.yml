name: Tests

on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest
          pip install -r requirements-extra.txt || true
          pip install -r site/requirements.txt || true
      - name: Offline test suite
        run: python -m pytest -q
      - name: Config and plan sanity (offline)
        run: |
          python -m leadgen doctor
          for c in config/examples/*.toml; do python -m leadgen doctor --config "$c" --secrets-only; done
          python -m leadgen plan --offline --db /tmp/plan-check.sqlite | head -12
      - name: QR pages build (preview)
        run: python site/build.py --preview --out /tmp/site-public
