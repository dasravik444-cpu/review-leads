name: Open data coverage probe

# Manual: measures how many businesses in the campaign area the open, re-usable
# datasets (Overture Maps places, Foursquare OS Places) contain. Prints counts only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "coverage | taxonomy | codes | config | lookup | emailsources"
        default: "coverage"
      config:
        description: "Campaign file (empty = repository variable RQ_CONFIG or config/us/austin.toml)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt duckdb
      - name: Probe
        run: python scripts/ci/opendata_probe.py "${{ inputs.config || vars.RQ_CONFIG || 'config/us/austin.toml' }}" "${{ inputs.mode }}"
