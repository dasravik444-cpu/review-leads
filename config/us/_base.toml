# Shared settings for every US city campaign (config/us/<city>.toml includes this file).
#
# One campaign per city keeps each city small and independent. The workflow "US fleet" runs all cities listed in
# config/us/fleet.toml at the same time, one GitHub job per city. Every city writes into the SAME Google Sheet:
# one "Leads" tab for all of them (the Lead ID prefix tells the city: AUS-17, NYC-503...) and one
# "Daily Report" tab with a row per city per run.
#
# US rules (docs/COMPLIANCE.md): cold B2B e-mail is allowed under CAN-SPAM if every e-mail has a truthful sender
# and subject, YOUR POSTAL ADDRESS and a working opt-out. WhatsApp: one by one, only to numbers a business
# publishes as WhatsApp (few US businesses do; e-mail is the main channel in the US).

[campaign]
country = "US"
language = "en"
region = "us"

[plan]
days = 10                # each city is split into 10 parts; with a public repository a city is done in about 10 days
daily_target = "auto"
order = "center_out"
min_cell_km = 1.0
max_cell_km = 8.0
split_threshold = 60
finish_scheduled_part = true

[compliance]
mode = "open-data"       # Overture Maps + OpenStreetMap + the businesses' own websites (no Google scraping)

[open_data]
min_confidence = 0.5
refresh_days = 30
exclude_codes = ["internet_cafe", "cafeteria", "hookah_bar", "gas_station", "convenience_store"]

[filters]
require_contact = true
exclude_closed = true
allow_unmatched_categories = false
# Chains decide centrally - poor leads. (Brands known to the open data are also skipped automatically.)
exclude_chains = [
  # food & drink
  "mcdonald", "starbucks", "chick-fil-a", "taco bell", "wendy's", "burger king", "subway", "chipotle", "panera",
  "dunkin", "domino", "pizza hut", "papa john", "little caesars", "marco's pizza", "sonic drive", "whataburger",
  "jack in the box", "in-n-out", "five guys", "shake shack", "olive garden", "applebee", "chili's", "ihop", "denny's",
  "waffle house", "buffalo wild wings", "cheesecake factory", "texas roadhouse", "outback", "red lobster", "p.f. chang",
  "panda express", "raising cane", "sweetgreen", "cava", "dutch bros", "peet's", "tim hortons", "krispy kreme",
  "jersey mike", "jimmy john", "firehouse subs", "wingstop", "popeyes", "kfc", "arby", "dairy queen", "culver",
  "zaxby", "bojangles", "cracker barrel", "red robin", "longhorn steakhouse", "chuck e. cheese", "golden corral",
  "qdoba", "moe's southwest", "jamba", "smoothie king", "tropical smoothie", "baskin", "cold stone", "insomnia cookies",
  "crumbl", "nothing bundt", "paris baguette", "einstein bros", "bruegger", "7-eleven",
  # beauty & fitness
  "great clips", "supercuts", "sport clips", "fantastic sams", "cost cutters", "regis salon", "drybar", "ulta",
  "european wax center", "hand & stone", "massage envy", "the joint chiropractic", "planet fitness", "la fitness",
  "anytime fitness", "24 hour fitness", "orangetheory", "gold's gym", "crunch fitness", "life time", "equinox",
  "blink fitness", "snap fitness", "pure barre", "club pilates", "f45", "solidcore", "burn boot camp", "9round",
  "ufc gym", "ymca", "xponential",
  # hotels
  "marriott", "hilton", "hyatt", "holiday inn", "hampton inn", "best western", "comfort inn", "comfort suites",
  "la quinta", "motel 6", "days inn", "super 8", "courtyard by marriott", "fairfield inn", "residence inn", "embassy suites",
  "doubletree", "sheraton", "westin", "quality inn", "red roof", "extended stay", "springhill suites", "homewood suites",
  "home2 suites", "candlewood", "staybridge", "wyndham", "ramada", "travelodge", "econo lodge", "sleep inn",
  # auto, pets, health, laundry
  "jiffy lube", "valvoline", "firestone", "goodyear", "discount tire", "pep boys", "midas", "meineke", "take 5",
  "mister car wash", "go car wash", "tommy's express", "zips car wash", "quick quack", "whistle express",
  "club car wash", "super star car wash", "tidal wave auto spa", "autobell", "maaco", "caliber collision", "safelite",
  "christian brothers", "monro", "mavis", "les schwab",
  "petsmart", "petco", "banfield", "vca animal", "aspen dental", "western dental", "bright now", "heartland dental",
  "pacific dental", "gentle dental", "smile brands", "kool smiles", "pearle vision", "lenscrafters", "america's best",
  "walgreens", "cvs", "1-800-flowers",
]
exclude_name_words = ["adult", "erotic", "strip club", "gentlemen's club", "escort", "cannabis", "dispensary", "smoke shop",
                      "vape"]

[enrich]
website = true
max_pages_per_site = 6
social_search = false
instagram_profile = false
check_email_mx = true
role_email_candidates = true
email_hunt = true
workers = 12             # 12 websites at a time (public repositories get 4-core machines)
site_interval_s = 2.0    # pause between two pages of the same website (polite crawling)

[crawler]
bot_name = "ReviewLeadBot"
contact_url = ""

[sheets]
enabled = true
leads_tab = "Leads"
plan_tab = ""                       # no per-city plan tab (many cities share the sheet)
report_tab = "Daily Report"         # one row per city per run
require_any = ["email", "whatsapp"] # only businesses we can actually write to go into the sheet
checkpoint_minutes = 20

[runtime]
time_budget_minutes = 150    # per city per day (the fleet workflow lowers it on a private repository)
safety_margin_minutes = 6
use_curl_cffi = false

[outreach]
mode = "dry-run"
offer = "It's a one-time setup, no subscription."
demo_url = ""
privacy_url = ""

[outreach.sender]
name = ""
business = ""
city = ""
phone = ""               # secret OUTREACH_SENDER_PHONE
postal_address = ""      # REQUIRED by CAN-SPAM: secret OUTREACH_POSTAL_ADDRESS
website = ""
notify_email = ""

[outreach.email]
enabled = true
start_per_day = 15
step = 5
step_every_days = 3
max_per_day = 40
window_start = "09:30"
window_end = "16:30"
days = ["mon", "tue", "wed", "thu", "fri"]
follow_up_days = [3, 7]

[outreach.whatsapp]
start_per_day = 5
step = 5
step_every_days = 7
max_per_day = 20
include_mobiles = false  # only numbers a business publishes as WhatsApp

# Every walk-in business that lives on reviews (config/shared/categories.toml).
[[categories]]
key = "hotel"
enabled = true

[[categories]]
key = "dental"
enabled = true

[[categories]]
key = "auto"
enabled = true

[[categories]]
key = "health"
enabled = true

[[categories]]
key = "pets"
enabled = true

[[categories]]
key = "tattoo"
enabled = true

[[categories]]
key = "entertainment"
enabled = true

[[categories]]
key = "retail"
enabled = true

[[categories]]
key = "laundry"
enabled = true
