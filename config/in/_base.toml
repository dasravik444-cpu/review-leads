# Shared settings for every India city campaign (config/in/<city>.toml includes this file).
#
# Focus: PREMIUM cafés, restaurants, bars and lounges, bakeries, salons and spas, and gyms - the places that can
# pay for their reputation. The open data has no price level, so "premium" is kept by what can be checked:
#   - a business goes to the Sheet only with its own website or an Instagram account ([sheets] require_presence);
#     the long tail without either rarely pays for online reputation;
#   - street food, fast food, dhabas, canteens, tea stalls and budget "parlours" are left out (names and categories);
#   - big chains are left out (their head office decides);
#   - each city is searched from its centre outwards, where the upmarket districts are.
# All India cities write into the SAME Google Sheet as the US, but into their own tabs ("India Leads", "India Daily
# Report", the "India ..." outreach tabs), so the two markets never mix.
#
# India rules (docs/COMPLIANCE.md): no cold e-mail law for businesses - say who you are and honour "no"; TRAI rules
# cover calls and SMS (not used); WhatsApp: one by one, by hand (docs/WHATSAPP.md).

[campaign]
country = "IN"
language = "en"
region = "in"

[plan]
# A city's campaign: about 1,000 businesses a day, as many days as the city needs (Bengaluru: 7 days, its own file).
days = "auto"
daily_target = 1000
order = "center_out"
min_cell_km = 1.0
max_cell_km = 6.0
split_threshold = 60
finish_scheduled_part = true

[compliance]
mode = "open-data"       # Overture Maps + OpenStreetMap + the businesses' own websites (no Google scraping)

[open_data]
min_confidence = 0.5
refresh_days = 30
# Budget formats the premium focus leaves out (codes that do not exist in the data simply match nothing).
exclude_codes = ["fast_food_restaurant", "food_truck", "food_truck_stand", "food_stand", "street_vendor", "food_court",
                 "kebab_shop", "sandwich_shop", "pizza_delivery_service", "cafeteria", "internet_cafe", "hookah_bar",
                 "candy_store", "smoothie_juice_bar"]

[filters]
require_contact = true
exclude_closed = true
allow_unmatched_categories = false
# Chains decide centrally - poor leads. (Brands known to the open data are also skipped automatically.)
# Premium salon franchises (outlets run by their own owners) are kept on purpose: top salons are the target.
exclude_chains = [
  # food & drink
  "cafe coffee day", "ccd", "starbucks", "barista lavazza", "barista coffee", "costa coffee", "chaayos", "chai point", "third wave coffee",
  "blue tokai", "tim hortons", "mcdonald", "kfc", "burger king", "domino", "pizza hut", "subway", "taco bell",
  "wow momo", "faasos", "behrouz biryani", "biryani by kilo", "haldiram", "bikanervala", "sagar ratna",
  "barbeque nation", "mainland china", "theobroma", "mad over donuts", "dunkin", "baskin robbins", "keventers",
  "burger singh", "goli vada pav", "jumboking", "la pino'z", "oven story", "the belgian waffle", "krispy kreme",
  "chai sutta bar", "adyar ananda bhavan", "a2b", "saravana bhavan", "rameshwaram cafe", "hard rock cafe",
  "naturals ice cream",
  # budget salon chains and company-run gyms
  "jawed habib", "green trends", "naturals salon", "cult fit", "cultfit", "anytime fitness", "gold's gym",
  "snap fitness", "talwalkars", "f45",
]
# Whole words (a plural counts too; "word*" matches every word starting with it).
exclude_name_words = ["dhaba", "canteen", "mess", "tiffin", "tea stall", "chai stall", "tea point", "juice centre",
                      "juice center", "juice corner", "fast food", "chaat", "momo", "roll centre", "roll center",
                      "street food", "paan", "pan shop", "beauty parlour", "beauty parlor", "ladies parlour",
                      "gents parlour", "unisex parlour", "saloon", "hair cutting", "bhojanalaya", "bhojnalaya",
                      "wine shop", "liquor"]

[enrich]
website = true
max_pages_per_site = 6
social_search = false
instagram_profile = false
check_email_mx = true
role_email_candidates = true
email_hunt = true
email_archive = true
email_search = true      # a web search for an address the business published elsewhere (see config/us/_base.toml)
workers = 12
site_interval_s = 2.0
search_interval_s = 12.0

[crawler]
bot_name = "ReviewLeadBot"
contact_url = ""

[sheets]
enabled = true
leads_tab = "India Leads"
plan_tab = ""
report_tab = "India Daily Report"
require_any = ["email", "whatsapp", "phone"]   # a way to reach them
require_presence = ["website", "instagram"]    # ... and their own website or Instagram: the premium focus
checkpoint_minutes = 20

[runtime]
time_budget_minutes = 120
safety_margin_minutes = 6
use_curl_cffi = false

[outreach]
mode = "dry-run"
offer = "It's a one-time price from ₹3,000, no monthly fees."
demo_url = ""
privacy_url = ""

[outreach.tabs]
outreach = "India Outreach"
preview = "India Email Preview"
replies = "India Replies"
whatsapp = "India WhatsApp Queue"
dnc = "Do Not Contact"              # shared with the US: a "no" counts everywhere
report = "India Outreach Report"
letters = "India Letters"

[outreach.sender]
name = "Ravik"
business = "Aurenflow"
city = "Kolkata"
phone = ""               # secret OUTREACH_SENDER_PHONE (your WhatsApp Business number)
postal_address = ""      # not required in India
website = ""
notify_email = ""

[outreach.email]
# On since 11 October 2026. Every day, every hour, around the clock.
enabled = true
# Your sending plan (11 October 2026), for EACH Gmail account in settings.txt (two accounts: twice as many e-mails,
# each account to its own businesses), counted from its first e-mail run after the update (hours -> e-mails):
#   0-6: 50 | 6-12: 75 | 12-18: 100 | 18-24: 100 | 24-36: 100 | 36-48: 120 | 48-60: 125 | 60-72: 150
#   then 200 every 12 hours.
# Follow-ups are part of these numbers. A run the robot missed (it searches for leads at night) is made up by the
# next ones. Never more than max_per_24h from one account in any 24 hours (your ceiling: 400; Gmail itself stops an
# account for a day at about 500). Sending also pauses by itself when Gmail answers "limit" or "blocked", or too many
# e-mails bounce.
plan = [[6, 50], [6, 75], [6, 100], [6, 100], [12, 100], [12, 120], [12, 125], [12, 150]]
plan_then = [12, 200]
max_per_24h = 400
max_per_run = 40           # e-mails in one hourly run at most (catching up after the night's lead search)
spread_minutes = 45        # each run's e-mails spread evenly over 45 minutes (17 e-mails: one every ~2.5 minutes)...
min_gap_seconds = 60       # ... never closer than a minute apart from one account ...
max_gap_seconds = 300      # ... nor further than 5 minutes
run_budget_minutes = 50    # a run stops in time for the next hour's
max_bounces_per_day = 10   # more bounced addresses than this in a day: sending pauses until tomorrow
pause_min_sends = 40       # the bounce brake: at least 3 bounces and 5% of at least 40 e-mails since the last pause:
pause_min_bounces = 3      # then sending pauses 12 hours and starts afresh (judged on the new e-mails only)
bounce_pause_hours = 12
window_start = "00:00"
window_end = "23:59"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
follow_up_days = [3, 7]
footer = """{sender_business}
WhatsApp: {sender_phone}

Not interested? Reply "no" and we won't e-mail again."""

[outreach.whatsapp]
# Indian businesses live on WhatsApp: their mobile numbers are queued too (one by one, by hand: docs/WHATSAPP.md).
# A new number starts small and grows with the days you actually send, so it is not reported and banned:
# 10 on the first day, 5 more after each day you sent, up to 40.
# Every phone number counts: a business's WhatsApp number first, then its mobiles, then its other numbers, one at a
# time; when you mark one "Not on WhatsApp", its next number is queued.
start_per_day = 10
step = 5
step_every_days = 1
max_per_day = 40
include_mobiles = true
include_landlines = true
# The message: the same words as the first e-mail, with the business's name in them, then the PDF (the tablet sends
# it into the chat right after; docs/WHATSAPP.md).
same_as_email = true

# Your list (11 October 2026): cafés, restaurants, bars, salons and gyms (config/shared/categories.toml has them on;
# bakeries are switched off here, the other kinds are off there).
[[categories]]
key = "bakery"
enabled = false
