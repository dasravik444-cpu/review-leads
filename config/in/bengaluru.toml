# Bengaluru - one city of the India campaign (config/in/fleet.toml). Shared settings: _base.toml.
# Made by scripts/make_in_cities.py - edit the list there and run it again.
include = ["../shared/categories.toml", "_base.toml"]

[campaign]
id = "in-bengaluru"
timezone = "Asia/Kolkata"
lead_id_prefix = "BLR"

[area]
name = "Bengaluru"
aliases = ["Bangalore", "Indiranagar", "Koramangala", "MG Road", "Whitefield", "HSR Layout"]
center = [12.9716, 77.5946]
radius_km = 18

[plan]
days = 7             # a 7-day campaign: the city's businesses spread over 7 evenings
daily_target = "auto"
